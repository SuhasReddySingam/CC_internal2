<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dummy Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .login-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      font-size: 14px;
      color: #555;
    }

    .input-group input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #4facfe;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #4facfe;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #3a8ee6;
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
    }

  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login</h2>

    <form onsubmit="return fakeLogin()">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>

      <button class="login-btn" type="submit">Login</button>
    </form>

    <div class="footer-text">
      Dummy system (no real authentication)
    </div>
  </div>

  <script>
    function fakeLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if(email === "admin@test.com" && password === "1234") {
        alert("Login successful!");
      } else {
        alert("Invalid credentials!");
      }

      return false; // prevent form submission
    }
  </script>

</body>
</html>
