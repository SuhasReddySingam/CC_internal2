<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.5rem;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #357abd;
    }

    .notes {
      margin-top: 20px;
      display: grid;
      gap: 15px;
    }

    .note {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
    }

    .delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff5c5c;
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete:hover {
      background: #e04848;
    }
  </style>
</head>
<body>

<header>Notes App</header>

<div class="container">
  <textarea id="noteInput" placeholder="Write your note..."></textarea>
  <button onclick="addNote()">Add Note</button>

  <div class="notes" id="notesContainer"></div>
</div>

<script>
  let notes = JSON.parse(localStorage.getItem('notes')) || [];

  function saveNotes() {
    localStorage.setItem('notes', JSON.stringify(notes));
  }

  function renderNotes() {
    const container = document.getElementById('notesContainer');
    container.innerHTML = '';

    notes.forEach((note, index) => {
      const div = document.createElement('div');
      div.className = 'note';

      div.innerHTML = `
        <button class="delete" onclick="deleteNote(${index})">X</button>
        <p>${note}</p>
      `;

      container.appendChild(div);
    });
  }

  function addNote() {
    const input = document.getElementById('noteInput');
    const text = input.value.trim();

    if (text === '') return;

    notes.unshift(text);
    input.value = '';
    saveNotes();
    renderNotes();
  }

  function deleteNote(index) {
    notes.splice(index, 1);
    saveNotes();
    renderNotes();
  }

  renderNotes();
</script>

</body>
</html>
